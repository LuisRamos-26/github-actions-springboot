
name: proyecto ci_cd flow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean install

     
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker credentials
        if: github.event_name == 'push'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "ERROR: Missing Docker credentials"
            exit 1
          fi

          if [[ "$DOCKER_PASSWORD" == *$'\n'* || "$DOCKER_PASSWORD" == *$'\r'* ]]; then
            echo "ERROR: Token contains newline characters"
            exit 1
          fi

          if [ "$DOCKER_USERNAME" != "luisramos26" ]; then
            echo "ERROR: Unexpected Docker username"
            exit 1
          fi

          echo "Docker credentials are present."
          echo "Username validation passed."

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          scope: 'luisramos26/api-springboot-image@push'


      # Construir y publicar imagen
      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: luisramos26/api-springboot-image:latest
